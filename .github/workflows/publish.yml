# Daily 9:00am ET: publish each brand's content/<brand>/approved/{today}.json if it exists.
# (Daily, not just the posting cadence, so off-cadence makeup posts fire too — days
# with no approved file exit quietly.)
# Brands: bequest (legacy content/ root, FB+IG+X+LI) then fgc (content/fgc/, FB only).
# Jobs run serially so their state commits never race.
# Fires at both DST candidate UTC hours; a gate step lets only the cron slot
# matching the current DST offset proceed. The gate keys off WHICH cron fired
# (github.event.schedule), not the wall-clock hour at run time — GitHub cron
# routinely starts 30-90+ min late, so an hour check would skip every run.
# A second pair of crons at 1pm ET is a same-day retry: on 10/5/26 GitHub never
# assigned a hosted runner to the morning run ("job was not acquired by Runner
# of type hosted"), both jobs were cancelled with zero steps, and the day's posts
# only went out via --catch-up the next afternoon. The retry slot republishes
# anything still sitting in approved/ a few hours later instead of a day later;
# on a normal day it finds nothing to do and commits nothing.
name: Publish

on:
  schedule:
    - cron: '0 13 * * *' # 9am EDT
    - cron: '0 14 * * *' # 9am EST
    - cron: '0 17 * * *' # 1pm EDT — same-day retry if the morning run was dropped
    - cron: '0 18 * * *' # 1pm EST — same-day retry
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to publish (YYYY-MM-DD). Empty = today ET.'
        required: false
        default: ''
      only:
        description: 'Comma-separated platforms to publish (fb,ig,x,li). Empty = all.'
        required: false
        default: ''
      brand:
        description: 'Which brand to publish (bequest | fgc | all)'
        required: false
        default: 'all'

permissions:
  contents: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || inputs.brand == 'bequest' || inputs.brand == 'all' || inputs.brand == ''
    steps:
      - name: DST gate — proceed only for the cron slot matching current ET offset
        id: gate
        run: |
          ZONE=$(TZ=America/New_York date +%Z)
          SCHED="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || { [ "$ZONE" = "EDT" ] && { [ "$SCHED" = "0 13 * * *" ] || [ "$SCHED" = "0 17 * * *" ]; }; } \
            || { [ "$ZONE" = "EST" ] && { [ "$SCHED" = "0 14 * * *" ] || [ "$SCHED" = "0 18 * * *" ]; }; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            # Once-a-day extras (Friday summary, queue-low check) run on the morning
            # slot only; the 1pm slot exists purely to republish what the morning missed.
            case "$SCHED" in
              "0 13 * * *"|"0 14 * * *") echo "primary=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "primary=false" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "Cron slot '$SCHED' doesn't match current zone $ZONE — the other DST candidate will run. Exiting."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.go == 'true'
        run: npm ci

      - name: Meta token preflight
        if: steps.gate.outputs.go == 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          # Meta sometimes answers with a transient "retry later" (code 2, is_transient:true)
          # — hit 10/8/26 while the same token passed in the next job 15s later. Retry a
          # few times; a transient failure after retries is a warning, not a dead token
          # (publish.js has its own error handling and --catch-up covers any miss).
          for i in 1 2 3 4; do
            R=$(curl -s --max-time 20 "https://graph.facebook.com/v21.0/me?access_token=$META_ACCESS_TOKEN")
            echo "$R" | grep -q '"id"' && { echo "Meta token OK"; exit 0; }
            echo "Preflight attempt $i failed: $R"
            [ "$i" -lt 4 ] && sleep 20
          done
          if echo "$R" | grep -Eq '"is_transient":true|"code":(1|2)[,}]'; then
            echo "::warning::Meta is returning a transient error, not a token problem — proceeding. Last response: $R"
            exit 0
          fi
          echo "::error::Bequest Meta token is DEAD or blocked — fix the token before anything can post. Response: $R"; exit 1

      - name: Publish
        id: publish
        if: steps.gate.outputs.go == 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS="--catch-up 3"
          [ -n "${{ inputs.date }}" ] && ARGS="$ARGS --date ${{ inputs.date }} --force"
          [ -n "${{ inputs.only }}" ] && ARGS="$ARGS --only ${{ inputs.only }}"
          node src/publish.js $ARGS 2>&1 | tee publish.log
          exit ${PIPESTATUS[0]}

      # Commit state even when a platform failed — successful post IDs must be
      # recorded so a retry never double-posts.
      #
      # Content commits ALONE and FIRST — it carries the published post ids,
      # and losing it means tomorrow's --catch-up republishes (double post).
      # docs/index.html is generated with a wall-clock timestamp, so it (a)
      # diffs on every run even when nothing published and (b) conflicts under
      # GitHub's checkout replication lag (a checkout seconds after the prior
      # push can still be stale — hit 9/29). No content change → commit
      # nothing: the timestamp-only push is what caused the 9/29 red run.
      - name: Commit publish state
        if: always() && steps.gate.outputs.go == 'true'
        run: |
          git config user.name "bequest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A content/
          if git diff --cached --quiet; then
            echo "No content changes — nothing published; skipping state commit and preview rebuild."
            exit 0
          fi
          git commit -m "Publish state $(TZ=America/New_York date +%Y-%m-%d) [skip ci]"
          git push || (git pull --rebase origin main && git push)
          # Preview second, non-fatal: a stale page is recoverable, a red job is not signal.
          git pull --rebase origin main || git rebase --abort || true
          node src/build-preview.js || true
          git add -A docs/
          git diff --cached --quiet || git commit -m "Rebuild preview [skip ci]"
          git push || (git pull --rebase -X theirs origin main && node src/build-preview.js && git add -A docs/ && (git diff --cached --quiet || git commit -m "Rebuild preview [skip ci]") && git push) || echo "::warning::Preview push failed; content state is committed. Next publish refreshes the page."

      # Friday runs: post the weekly summary issue after publishing.
      - name: Weekly summary (Fridays)
        if: steps.gate.outputs.go == 'true' && steps.gate.outputs.primary == 'true' && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(TZ=America/New_York date +%u)" = "5" ]; then
            node src/notify.js summary || true
          fi

      - name: Upload run log
        if: always() && steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: publish-log-${{ github.run_id }}
          path: publish.log
          if-no-files-found: ignore

  publish-fgc:
    runs-on: ubuntu-latest
    needs: publish
    # Runs after the bequest job (serialized state commits), even if bequest
    # failed or was skipped by brand selection.
    if: >-
      always() && (
        github.event_name == 'schedule' ||
        inputs.brand == 'fgc' || inputs.brand == 'all' || inputs.brand == ''
      )
    steps:
      - name: DST gate — proceed only for the cron slot matching current ET offset
        id: gate
        run: |
          ZONE=$(TZ=America/New_York date +%Z)
          SCHED="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || { [ "$ZONE" = "EDT" ] && { [ "$SCHED" = "0 13 * * *" ] || [ "$SCHED" = "0 17 * * *" ]; }; } \
            || { [ "$ZONE" = "EST" ] && { [ "$SCHED" = "0 14 * * *" ] || [ "$SCHED" = "0 18 * * *" ]; }; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            # Once-a-day extras (Friday summary, queue-low check) run on the morning
            # slot only; the 1pm slot exists purely to republish what the morning missed.
            case "$SCHED" in
              "0 13 * * *"|"0 14 * * *") echo "primary=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "primary=false" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.go == 'true'
        run: npm ci

      - name: Meta token preflight
        if: steps.gate.outputs.go == 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          # Meta sometimes answers with a transient "retry later" (code 2, is_transient:true)
          # — hit 10/8/26 while the same token passed in the next job 15s later. Retry a
          # few times; a transient failure after retries is a warning, not a dead token
          # (publish.js has its own error handling and --catch-up covers any miss).
          for i in 1 2 3 4; do
            R=$(curl -s --max-time 20 "https://graph.facebook.com/v21.0/me?access_token=$META_ACCESS_TOKEN")
            echo "$R" | grep -q '"id"' && { echo "Meta token OK"; exit 0; }
            echo "Preflight attempt $i failed: $R"
            [ "$i" -lt 4 ] && sleep 20
          done
          if echo "$R" | grep -Eq '"is_transient":true|"code":(1|2)[,}]'; then
            echo "::warning::Meta is returning a transient error, not a token problem — proceeding. Last response: $R"
            exit 0
          fi
          echo "::error::Meta token is DEAD or blocked — FGC cannot post. Response: $R"; exit 1

      - name: Publish (Florida Glass — Facebook only)
        id: publish
        if: steps.gate.outputs.go == 'true'
        env:
          BRAND: fgc
          # The dedicated FGC app got "API access blocked" by Meta on 9/21 —
          # both brands now post via the established Bequest system-user token
          # (the FGC page lives in the same business portfolio).
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FGC_PAGE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS="--only fb --catch-up 3"
          [ -n "${{ inputs.date }}" ] && ARGS="$ARGS --date ${{ inputs.date }} --force"
          node src/publish.js $ARGS 2>&1 | tee publish-fgc.log
          exit ${PIPESTATUS[0]}

      # Same split as the bequest job: content alone first (post ids must
      # survive), preview second and non-fatal, nothing at all on no-post days.
      - name: Commit publish state
        if: always() && steps.gate.outputs.go == 'true'
        run: |
          git config user.name "bequest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A content/
          if git diff --cached --quiet; then
            echo "No content changes — nothing published; skipping state commit and preview rebuild."
            exit 0
          fi
          git commit -m "FGC publish state $(TZ=America/New_York date +%Y-%m-%d) [skip ci]"
          git push || (git pull --rebase origin main && git push)
          git pull --rebase origin main || git rebase --abort || true
          node src/build-preview.js || true
          git add -A docs/
          git diff --cached --quiet || git commit -m "Rebuild preview [skip ci]"
          git push || (git pull --rebase -X theirs origin main && node src/build-preview.js && git add -A docs/ && (git diff --cached --quiet || git commit -m "Rebuild preview [skip ci]") && git push) || echo "::warning::Preview push failed; content state is committed. Next publish refreshes the page."

      # Warn (once per title) when the seeded FGC queue is nearly dry — whether
      # to continue past the seeded window is a business call (buyout watch).
      - name: FGC queue-low check
        if: steps.gate.outputs.go == 'true' && steps.gate.outputs.primary == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(TZ=America/New_York date +%Y-%m-%d)
          LEFT=$(ls content/fgc/approved/*.json 2>/dev/null | xargs -n1 basename 2>/dev/null | sed 's/\.json//' | awk -v t="$TODAY" '$0 >= t' | wc -l | tr -d ' ')
          echo "FGC posts remaining (today or later): $LEFT"
          if [ "$LEFT" -le 3 ]; then
            TITLE="FGC queue low: $LEFT scheduled posts remain"
            if [ -z "$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[].number')" ]; then
              gh issue create --title "$TITLE" --body "The Florida Glass approved queue is nearly empty. Decide whether to build the next batch (buyout status permitting) — see ClickUp task 86e38bd1m and ~/Downloads/bequest-social-cards-generator.py." || true
            fi
          fi

      - name: Upload run log
        if: always() && steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: publish-fgc-log-${{ github.run_id }}
          path: publish-fgc.log
          if-no-files-found: ignore
